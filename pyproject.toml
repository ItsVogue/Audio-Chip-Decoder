[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiochip"
version = "0.5.1"
description = "Audio Chip Decoder: find and decode audio stored on memory chips"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "soundfile>=0.12", "pyserial>=3.5", "pyusb>=1.2", "libusb-package>=1.0.26", "sounddevice>=0.4.6"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
audiochip = "audiochip.cli:main"

[tool.setuptools.packages.find]
include = ["audiochip*"]

[tool.setuptools.package-data]
audiochip = ["gui/*.ico", "readers/xgecu/*"]
