[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audiochip"
version = "0.3.2"
description = "Audio Chip Decoder: find and decode audio stored on memory chips"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
audiochip = "audiochip.cli:main"

[tool.setuptools.packages.find]
include = ["audiochip*"]

[tool.setuptools.package-data]
audiochip = ["gui/*.ico", "readers/xgecu/*"]
