# Tests the app on Windows, builds the one-file installer, and publishes it on a version tag.
#   push to main        -> tests + installer kept as a build artifact for 30 days
#   push a tag "v1.2.3" -> the same, and the installer is attached to a GitHub release
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      AUDIOCHIP_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app's packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pyinstaller

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import audiochip; print(audiochip.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match the app version $v"; exit 1
          }

      - name: Run the tests on Windows
        run: python -m pytest -q tests

      - name: Check that the bundled XGecu helper runs on Windows
        shell: pwsh
        working-directory: audiochip/readers/xgecu
        run: |
          $out = (& .\minipro.exe --version 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch "minipro") { Write-Error "minipro.exe did not start"; exit 1 }
          $out = (& .\minipro.exe -k 2>&1 | Out-String)
          Write-Host "Presence check with nothing plugged in said: $out"
          exit 0

      - name: Build the standalone program
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name AudioChipDecoder
          --icon audiochip/gui/icon.ico
          --add-data "audiochip/gui/icon.ico;audiochip/gui"
          --add-data "audiochip/readers/xgecu;audiochip/readers/xgecu"
          --collect-all libusb_package
          --collect-all soundfile
          --hidden-import serial.tools.list_ports_windows
          --paths . tools/launch.py

      - name: Self-test the standalone program
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AudioChipDecoder\AudioChipDecoder.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed with exit code $($p.ExitCode)"; exit 1 }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" tools\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AudioChipDecoder-Setup-${{ steps.ver.outputs.version }}
          path: dist/AudioChipDecoder-Setup-*.exe
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Audio Chip Decoder ${{ steps.ver.outputs.version }}
          files: dist/AudioChipDecoder-Setup-*.exe
          body: |
            Download **AudioChipDecoder-Setup-${{ steps.ver.outputs.version }}.exe** below and run it.
            It installs for the current user only, needs no administrator rights and no Python.
            Windows SmartScreen may warn because the installer is not code-signed: choose "More info", then "Run anyway".
